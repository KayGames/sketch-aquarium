<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04182e">
<title>スケッチアクアリウム</title>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
<style>
  :root {
    --ink: #e8f6ff;
    --sub: #9cc3d8;
    --panel: rgba(6, 28, 50, 0.92);
    --accent: #ffb547;
    --accent-ink: #2a1600;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #04182e; color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", system-ui, sans-serif;
    overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  body.cam #cam { display: block; }
  #cam.mirror { transform: scaleX(-1); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.on { animation: flash .45s ease-out; }
  @keyframes flash { from { opacity: .85; } to { opacity: 0; } }
  .btn.round { width: 52px; padding: 0; font-size: 22px; }
  body:not(.cam) #btn-flip { display: none; }
  #preview { gap: 8px; }
  #preview canvas { flex: 1; min-width: 0; }
  #photo-img { display: block; width: 100%; max-height: 60vh; object-fit: contain; border-radius: 12px; margin-bottom: 14px; }
  .seg { display: flex; gap: 8px; margin-bottom: 14px; }
  .seg label { flex: 1; text-align: center; padding: 12px 8px; border-radius: 12px; background: rgba(255,255,255,.1);
    cursor: pointer; font-weight: 700; }
  .seg input { display: none; }
  .seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .btn[hidden] { display: none; }
  .m-menu .btn { font-size: 14px; padding: 0 12px; white-space: nowrap; }
  #tank { position: fixed; inset: 0; }
  #tank canvas { display: block; }

  header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center;
    justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) 16px 0; pointer-events: none; }
  header h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .08em;
    text-shadow: 0 1px 6px rgba(0,0,0,.5); }
  #count { font-size: 13px; color: var(--sub); margin-left: 8px; font-weight: 400; }
  .icon-btn { pointer-events: auto; width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.12); color: var(--ink); font-size: 20px; }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
    padding: 0 16px max(20px, env(safe-area-inset-bottom)); }
  .hint { flex-basis: 100%; margin: 0; text-align: center; font-size: 12px; color: var(--ink);
    text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 0 22px; border-radius: 26px; border: 0; font: inherit; font-size: 16px;
    font-weight: 700; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 20px rgba(255,181,71,.35); }
  .btn.ghost { background: rgba(255,255,255,.14); color: var(--ink); }
  .btn input { display: none; }

  #sheet { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(0, 8, 18, .55); }
  #sheet[hidden] { display: none; }
  .card { width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; background: var(--panel);
    border-radius: 20px 20px 0 0; padding: 20px 16px max(20px, env(safe-area-inset-bottom)); }
  .card h2 { margin: 0 0 12px; font-size: 18px; }
  .card p { margin: 0 0 14px; line-height: 1.6; color: var(--sub); font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row .btn { flex: 1; }
  .mode { display: none; }
  #sheet[data-mode="busy"] .m-busy, #sheet[data-mode="result"] .m-result,
  #sheet[data-mode="error"] .m-error, #sheet[data-mode="menu"] .m-menu,
  #sheet[data-mode="photo"] .m-photo { display: block; }
  #sheet[data-mode="result"] .m-debug, #sheet[data-mode="error"] .m-debug { display: block; }

  #preview { display: flex; justify-content: center; margin: 4px 0 16px;
    background: repeating-conic-gradient(#0c3150 0 25%, #0a2a46 0 50%) 0 0 / 20px 20px; border-radius: 12px; }
  #preview canvas { width: min(100%, 320px); height: auto; }
  .spinner { width: 36px; height: 36px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 1s linear infinite; margin: 8px auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  details { margin-top: 14px; color: var(--sub); font-size: 12px; }
  summary { cursor: pointer; }
  #debug-img canvas { width: 100%; height: auto; margin-top: 8px; border-radius: 8px; }
  #debug-info { margin-top: 6px; word-break: break-all; }
  .err { color: #ffd2b0 !important; }
  .fatal { position: fixed; inset: auto 16px 50%; text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<div id="tank"></div>
<div id="flash"></div>

<header>
  <h1>スケッチアクアリウム<span id="count"></span></h1>
  <button class="icon-btn" id="btn-menu" aria-label="メニュー">⋯</button>
</header>

<div class="dock">
  <p class="hint" id="hint"></p>
  <button class="btn ghost round" id="btn-flip" aria-label="カメラ切り替え">🔄</button>
  <button class="btn primary" id="btn-shoot">📷 読み取る</button>
  <button class="btn ghost round" id="btn-photo" aria-label="写真を撮る">📸</button>
  <input id="in-camera" type="file" accept="image/*" capture="environment" hidden>
</div>

<div id="sheet" hidden>
  <div class="card">
    <div class="mode m-busy">
      <div class="spinner"></div>
      <p style="text-align:center">読み取り中…</p>
    </div>

    <div class="mode m-result">
      <h2 id="result-title"></h2>
      <div id="preview"></div>
      <div class="row">
        <button class="btn ghost" id="btn-retake">撮り直す</button>
        <button class="btn ghost" id="btn-skip">うらなしで放つ</button>
        <button class="btn primary" id="btn-next">うらを読む →</button>
        <button class="btn primary" id="btn-release">🐟 放つ</button>
      </div>
    </div>

    <div class="mode m-error">
      <h2>うまく読み取れませんでした</h2>
      <p class="err" id="err-msg"></p>
      <div class="row">
        <button class="btn ghost" data-close>閉じる</button>
        <button class="btn primary" id="btn-retake2">📷 撮り直す</button>
      </div>
    </div>

    <div class="mode m-debug">
      <details>
        <summary>検出の詳細</summary>
        <div id="debug-img"></div>
        <div id="debug-info"></div>
      </details>
    </div>

    <div class="mode m-photo">
      <h2>📸 写真</h2>
      <img id="photo-img" alt="撮った写真">
      <div class="row">
        <button class="btn ghost" data-close>閉じる</button>
        <button class="btn primary" id="btn-save-photo">保存・共有</button>
      </div>
    </div>

    <div class="mode m-menu">
      <h2>メニュー</h2>
      <p>読み取るもの</p>
      <div class="seg">
        <label><input type="radio" name="mode" value="balloon">🎈 バルーン</label>
        <label><input type="radio" name="mode" value="paper">🐟 紙のさかな</label>
      </div>
      <p>読み取ると自動で切り替わります。バルーンは「おもて → うら」の順。点線の円の中はぬらないでね。</p>
      <div class="row" style="margin-bottom:10px">
        <label class="btn ghost">🖼 写真から
          <input id="in-file" type="file" accept="image/*">
        </label>
        <button class="btn ghost" id="btn-restart-scan">↺ やり直す</button>
      </div>
      <div class="row" style="margin-bottom:10px">
        <a class="btn ghost" href="balloon_test_A4.pdf" target="_blank" rel="noopener">📄 バルーン A4</a>
        <a class="btn ghost" href="template_A4.pdf" target="_blank" rel="noopener">📄 さかな A4</a>
      </div>
      <div class="row">
        <button class="btn ghost" id="btn-clear">🗑 ぜんぶ消す</button>
        <button class="btn primary" data-close>閉じる</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
